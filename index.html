<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>商品サンプル発送・紹介受付フォーム</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
<body class="min-h-screen text-slate-800 pb-12">

  <!-- ヘッダー (ボタンと同一の美しいネイビーグラデーション) -->
  <header style="background: linear-gradient(135deg, #1d4ed8 0%, #1e3a8a 45%, #0f172a 100%);" class="text-white py-4 px-5 shadow-lg shadow-blue-950/20 sticky top-0 z-20">
    <div class="max-w-md mx-auto">
      <h1 class="text-base font-bold tracking-tight">商品サンプル紹介 申請フォーム</h1>
      <p class="text-xs text-blue-100 mt-0.5">紹介したい商品の詳細（色・サイズ等）をご指定ください</p>
    </div>
  </header>

  <!-- ローディング表示 -->
  <div id="loading" class="flex flex-col items-center justify-center py-24 space-y-4">
    <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-sm text-slate-500 font-medium" id="loading-text">LINE認証中...</p>
  </div>

  <!-- エラー表示 -->
  <div id="error-box" class="hidden max-w-md mx-auto p-4 m-4 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm">
    <div class="font-bold flex items-center gap-1.5">
      <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      エラーが発生しました
    </div>
    <p id="error-message" class="mt-1 text-xs text-red-500"></p>
  </div>

  <!-- メインコンテンツ -->
  <main id="app" class="hidden max-w-md mx-auto px-4 mt-4 space-y-4">

    <!-- ユーザー挨拶カード -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <img id="user-picture" src="https://via.placeholder.com/48" alt="Profile" class="w-10 h-10 rounded-full object-cover border border-slate-200">
        <div>
          <p class="text-[11px] text-slate-400">ログイン中アカウント</p>
          <p id="user-name" class="font-bold text-sm text-slate-800">読み込み中...</p>
        </div>
      </div>
      <div id="group-badge" class="hidden text-[11px] bg-slate-100 text-slate-700 border border-slate-200 px-2.5 py-1 rounded-full font-medium">
        グループ連携中
      </div>
    </div>

    <form id="request-form" class="space-y-4" onsubmit="handleSubmit(event)">

      <!-- セクション1: 紹介したい商品 (複数追加可能) -->
      <div class="space-y-3">
        <div class="flex items-center justify-between px-1">
          <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-900"></span>
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-700">紹介したい商品</h2>
          </div>
          <span class="text-[11px] text-slate-500 font-medium" id="product-count-badge">計 1 点</span>
        </div>

        <!-- 商品カード一覧コンテナ -->
        <div id="products-container" class="space-y-3">
          <!-- 初回商品カード (JavaScriptから動的生成、または初期HTML) -->
          <div class="product-card bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3 relative transition-all" data-index="1">
            <div class="flex items-center justify-between border-b border-slate-100 pb-2">
              <span class="product-badge text-xs font-bold text-blue-950 bg-blue-50 px-2.5 py-1 rounded-lg">
                商品 1
              </span>
              <button type="button" onclick="removeProductCard(this)" class="remove-btn hidden text-xs text-rose-500 hover:text-rose-700 font-medium py-1 px-2 rounded-lg hover:bg-rose-50 transition-colors">
                削除
              </button>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">
                商品名 <span class="text-rose-500">*</span>
              </label>
              <input type="text" class="prod-name w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 bg-slate-50" required placeholder="例: 美白美容液 30ml">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">
                商品リンク / URL <span class="text-[11px] text-slate-400 font-normal">（任意）</span>
              </label>
              <input type="text" class="prod-url w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 bg-slate-50" placeholder="例: https://vt.tiktok.com/... または 商品ページURL">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">
                希望バリエーション <span class="text-[11px] text-slate-400 font-normal">（カラー・サイズ・型番など）</span>
              </label>
              <input type="text" class="prod-variation w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 bg-slate-50" placeholder="例: カラー: ネイビー / サイズ: M / 01番 など">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">
                商品詳細・ご要望 <span class="text-[11px] text-slate-400 font-normal">（任意）</span>
              </label>
              <textarea class="prod-details w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 bg-slate-50" rows="2" placeholder="例: 第2希望カラー、アパレルの丈感、セットの内訳など"></textarea>
            </div>
          </div>
        </div>

        <!-- ＋ 商品を追加するボタン -->
        <button type="button" onclick="addProductCard()" class="w-full py-3 border-2 border-dashed border-blue-900/30 hover:border-blue-900/60 bg-blue-50/50 hover:bg-blue-50 text-blue-950 font-bold text-xs rounded-2xl flex items-center justify-center space-x-1.5 transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
          <span>別の商品を追加する</span>
        </button>
      </div>

      <!-- セクション2: クリエイター情報 & 氏名 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3.5">
        <div class="flex items-center space-x-2 border-b border-slate-100 pb-2">
          <span class="w-2 h-2 rounded-full bg-blue-900"></span>
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-600">クリエイター情報</h2>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">クリエイターID (TikTokアカウント名) <span class="text-rose-500">*</span></label>
          <input type="text" id="creator_id" required placeholder="例: @tiktok_hanako"
                 class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 bg-slate-50">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">氏名 (本名) <span class="text-rose-500">*</span></label>
          <input type="text" id="real_name" required placeholder="例: 山田 花子"
                 class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 bg-slate-50">
        </div>
      </div>

      <!-- セクション3: お届け先住所の確認（チェックボックス） -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
        <div class="flex items-center space-x-2 border-b border-slate-100 pb-2">
          <span class="w-2 h-2 rounded-full bg-blue-900"></span>
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-600">お届け先住所の確認</h2>
        </div>

        <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5">
          <label class="flex items-start space-x-3 cursor-pointer">
            <input type="checkbox" id="address_confirmed" checked
                   class="mt-0.5 w-5 h-5 rounded text-blue-900 focus:ring-blue-900 border-slate-300">
            <div class="text-xs text-slate-700 leading-snug">
              <span class="font-bold text-slate-900 block mb-0.5">登録済みのお届け先住所に変更はありません</span>
              ※住所に変更がある方、または初めて依頼される方はチェックを外してください。個別チャットにて住所をお伺いいたします。
            </div>
          </label>
        </div>
      </div>

      <!-- 送信ボタン -->
      <div class="pt-2">
        <button type="submit" id="submit-btn"
                style="background: linear-gradient(135deg, #1d4ed8 0%, #1e3a8a 45%, #0f172a 100%);"
                class="w-full py-3.5 text-white font-bold text-base rounded-2xl shadow-lg shadow-blue-900/30 active:scale-[0.99] transition-all hover:opacity-95">
          この内容で申請する
        </button>
      </div>

    </form>

    <p class="text-[11px] text-slate-400 text-center leading-relaxed px-4">
      ※ご入力いただいた内容をもとに店舗へサンプル発送を手配いたします。
  </main>


  <!-- 送信完了画面 -->
  <div id="success-screen" class="hidden max-w-md mx-auto px-6 py-16 text-center space-y-4">
    <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto shadow-sm">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
    </div>
    <h2 class="text-xl font-bold text-slate-800">申請を受け付けました！</h2>
    <p class="text-sm text-slate-600 leading-relaxed" id="success-message">
      店舗へ商品詳細を共有し、発送手配を進めます。<br>
      住所の確認が必要な場合は、個別LINEにてご連絡いたします。
    </p>
    <div class="pt-4">
      <button onclick="liff.closeWindow()" class="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl">
        閉じる
      </button>
    </div>
  </div>

  <script>
    // ==========================================
    // 設定項目
    // ==========================================
    const LIFF_ID = "2011742602-wOuLBR5Z";
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbxd1kk9tMCLJFuYZqaHwTk6ugFCYh259k7rtYljO9cQfvP5G7Uh4uu0G-qCmSKun2If/exec";

    let contextData = {
      userId: "",
      displayName: "",
      pictureUrl: "",
      groupId: "",
      type: ""
    };

    // 画面初期化
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        contextData.userId = profile.userId;
        contextData.displayName = profile.displayName;
        contextData.pictureUrl = profile.pictureUrl || "https://via.placeholder.com/48";

        const context = liff.getContext();
        if (context) {
          contextData.type = context.type;
          contextData.groupId = context.groupId || "";
          if (contextData.groupId) {
            document.getElementById("group-badge").classList.remove("hidden");
          }
        }

        document.getElementById("user-name").textContent = contextData.displayName;
        document.getElementById("user-picture").src = contextData.pictureUrl;

        // URLパラメータからの商品名補完
        const urlParams = new URLSearchParams(window.location.search);
        const paramProduct = urlParams.get("product") || urlParams.get("product_name");
        if (paramProduct) {
          document.getElementById("product_name").value = paramProduct;
        }

        const paramGroup = urlParams.get("groupId") || urlParams.get("group");
        if (paramGroup && !contextData.groupId) {
          contextData.groupId = paramGroup;
        }

        document.getElementById("loading").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");

      } catch (err) {
        showError("LIFFの初期化に失敗しました: " + err.message);
      }
    });

    // 複数商品の動的追加・削除
    function addProductCard() {
      const container = document.getElementById("products-container");
      const card = document.createElement("div");
      card.className = "product-card bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3 relative transition-all";
      card.innerHTML = `
        <div class="flex items-center justify-between border-b border-slate-100 pb-2">
          <span class="product-badge text-xs font-bold text-blue-950 bg-blue-50 px-2.5 py-1 rounded-lg">
            商品
          </span>
          <button type="button" onclick="removeProductCard(this)" class="remove-btn text-xs text-rose-500 hover:text-rose-700 font-medium py-1 px-2 rounded-lg hover:bg-rose-50 transition-colors">
            削除
          </button>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">
            商品名 <span class="text-rose-500">*</span>
          </label>
          <input type="text" class="prod-name w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 bg-slate-50" required placeholder="例: 美白美容液 30ml">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">
            商品リンク / URL <span class="text-[11px] text-slate-400 font-normal">（任意）</span>
          </label>
          <input type="text" class="prod-url w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 bg-slate-50" placeholder="例: https://vt.tiktok.com/... または 商品ページURL">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">
            希望バリエーション <span class="text-[11px] text-slate-400 font-normal">（カラー・サイズ・型番など）</span>
          </label>
          <input type="text" class="prod-variation w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 bg-slate-50" placeholder="例: カラー: ネイビー / サイズ: M / 01番 など">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">
            商品詳細・ご要望 <span class="text-[11px] text-slate-400 font-normal">（任意）</span>
          </label>
          <textarea class="prod-details w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 bg-slate-50" rows="2" placeholder="例: 第2希望カラー、アパレルの丈感、セットの内訳など"></textarea>
        </div>
      `;
      container.appendChild(card);
      updateProductCardsUI();

      // 新しく追加されたカードの商品名入力欄にスムーズにスクロール
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.querySelector('.prod-name').focus();
    }

    function removeProductCard(btn) {
      const card = btn.closest(".product-card");
      if (card) {
        card.remove();
        updateProductCardsUI();
      }
    }

    function updateProductCardsUI() {
      const cards = document.querySelectorAll(".product-card");
      const count = cards.length;
      document.getElementById("product-count-badge").textContent = `計 ${count} 点`;

      cards.forEach((card, idx) => {
        const badge = card.querySelector(".product-badge");
        if (badge) badge.textContent = `商品 ${idx + 1}`;

        const removeBtn = card.querySelector(".remove-btn");
        if (removeBtn) {
          if (count > 1) {
            removeBtn.classList.remove("hidden");
          } else {
            removeBtn.classList.add("hidden");
          }
        }
      });
    }

    // フォーム送信
    async function handleSubmit(e) {
      e.preventDefault();

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = "送信中...";
      submitBtn.classList.add("opacity-60", "cursor-not-allowed");

      // 各商品カードからデータを収集
      const cards = document.querySelectorAll(".product-card");
      const products = [];

      cards.forEach(card => {
        const name = card.querySelector(".prod-name").value.trim();
        const url = card.querySelector(".prod-url").value.trim();
        const variation = card.querySelector(".prod-variation").value.trim();
        const details = card.querySelector(".prod-details").value.trim();

        if (name) {
          products.push({
            name: name,
            url: url,
            variation: variation,
            details: details
          });
        }
      });

      if (products.length === 0) {
        alert("少なくとも1点以上の商品名を入力してください。");
        submitBtn.disabled = false;
        submitBtn.textContent = "この内容で申請する";
        submitBtn.classList.remove("opacity-60", "cursor-not-allowed");
        return;
      }

      // 互換性のため代表値もセット
      const primaryProduct = products[0];
      const payload = {
        userId: contextData.userId,
        lineDisplayName: contextData.displayName,
        groupId: contextData.groupId,
        contextType: contextData.type,

        // 複数商品配列
        products: products,

        // 単体用フィールド（互換性担保）
        productName: products.map(p => p.name).join(" / "),
        productColor: primaryProduct.variation || "",
        productSize: "",
        productQty: products.length,
        productDetails: products.map((p, i) => `【商品${i+1}: ${p.name}】` + (p.url ? ` URL: ${p.url}` : '') + (p.variation ? ` バリエ: ${p.variation}` : '') + (p.details ? ` 備考: ${p.details}` : '')).join("\n"),

        // クリエイター情報
        creatorId: document.getElementById("creator_id").value.trim(),
        realName: document.getElementById("real_name").value.trim(),
        addressConfirmed: document.getElementById("address_confirmed").checked
      };

      try {
        if (typeof google !== "undefined" && google.script && google.script.run) {
          // GASから配信されている場合はgoogle.script.runで直接実行
          await new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler((res) => {
                if (res && res.success) resolve(res);
                else reject(new Error(res ? res.message : "送信に失敗しました"));
              })
              .withFailureHandler((err) => reject(err))
              .submitShippingRequest(payload);
          });
        } else {
          // GitHub Pages から GAS への送信
          const res = await fetch(GAS_ENDPOINT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          if (!result.success) {
            throw new Error(result.message || "送信に失敗しました");
          }
        }

        document.getElementById("app").classList.add("hidden");
        document.getElementById("success-screen").classList.remove("hidden");

      } catch (err) {
        alert("エラーが発生しました: " + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "この内容で申請する";
        submitBtn.classList.remove("opacity-60", "cursor-not-allowed");
      }
    }

    function showError(msg) {
      document.getElementById("loading").classList.add("hidden");
      document.getElementById("error-box").classList.remove("hidden");
      document.getElementById("error-message").textContent = msg;
    }
  </script>
</body>
</html>
